worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    upstream piloto_web {
        include /etc/nginx/upstreams/web.conf;
    }

    upstream piloto_api {
        include /etc/nginx/upstreams/api.conf;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://piloto_api/;
        }

        location / {
            proxy_pass http://piloto_web;
        }
    }
}
